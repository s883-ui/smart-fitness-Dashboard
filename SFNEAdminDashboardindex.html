async function raw(path,body,auth){
 if(MOCK)return mock(path,body||{},{tk:auth&&sess&&sess.token});
 try{const r=await fetch(API+path,{method:path==='/api/author/google-callback'?'GET':'POST',credentials:'include',headers:{'Content-Type':'application/json',...(auth&&sess&&sess.token?{Authorization:'Bearer '+sess.token}:{})},body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}return{status:r.status,data:d}}catch(e){return{status:0,data:null}}}
async function call(path,body,auth,retry=true){
 let r=await raw(path,body,auth);
 if(r.status===401&&auth&&retry&&path!=='/api/author/refresh-token'){if(await refresh())return call(path,body,auth,false);expire();throw{status:401,data:{code:'User.InvalidRefreshToken'}}}
 if(r.status<200||r.status>=300)throw r;return r.data}
function refresh(){ // shared promise: concurrent 401s wait for one refresh
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{const d=await call('/api/author/refresh-token',{token:sess&&sess.token||'',refreshToken:sess&&sess.rt||''},false,false);setSess(d);return true}catch(e){return false}finally{refreshing=null}})();return refreshing}
function setSess(d){sess={user:{id:d.id,email:d.email,name:d.firstName+' '+d.lastName,userName:d.userName},token:d.token,rt:d.refreshToken,exp:Date.now()+d.expiresIn*1000,rExp:new Date(d.refreshTokenExpiration).getTime()};
 (ls.get('sfne_rem')==='1'?ls:sst).set('sfne_sess',JSON.stringify({user:sess.user,rExp:sess.rExp}))}
function clearSess(){sess=null;ls.del('sfne_sess');sst.del('sfne_sess');ls.del('sfne_mock_cookie')}
function expire(){clearSess();flash={t:'err',m:t('m_exp')};go('login')}

 const k=Object.keys(S).find(k=>/^(User\.|ExternalLoginFailed|MissingEmail)/.test(k)&&j.includes(k));if(k)return t(k);
 const v=e.data&&e.data.errors;if(v){const x=(Array.isArray(v)?v:Object.values(v).flat())[0];if(x)return esc(typeof x==='string'?x:x.description||x.message||t('gen'))}return t('gen')}

function validate(f,rule){let bad=false;f.querySelectorAll('.fe').forEach(x=>x.textContent='');f.querySelectorAll('input').forEach(i=>i.classList.remove('bad'));
 for(const [id,fn] of Object.entries(rule)){const i=f.querySelector('#'+id);const m=fn(i.value.trim(),i.value);if(m){bad=true;f.querySelector('#e_'+id).textContent=t(m);i.classList.add('bad')}}return !bad}
const R={req:v=>v?'':'req',email:v=>!v?'req':EM.test(v)?'':'e_email',len:v=>!v?'req':v.length<3||v.length>100?'e_len':'',pw:(v,raw)=>!raw?'req':PW.test(raw)?'':'e_pw',pwlogin:(v,raw)=>raw?'':'req'};
const H={
async login(f,d){if(!validate(f,{email:R.email,password:R.pwlogin}))return;pending={email:d.email};
 ls.set('sfne_rem',d.remember?'1':'0');try{setSess(await call('/api/author/login',{email:d.email,password:d.password}));go('dashboard')}catch(e){show(errMsg(e)+(NC(e)?` <a data-rs>${t('resend')}</a>`:''));if(NC(e))$('#al').querySelector('[data-rs]').onclick=()=>go('confirm')}},
async register(f,d){if(!validate(f,{firstName:R.len,lastName:R.len,userName:R.len,email:R.email,password:R.pw}))return;
 try{const r=await call('/api/author/register',d);pending={email:d.email,userId:r.userId||''};flash={t:'ok',m:t('m_reg')};go('confirm')}catch(e){show(errMsg(e))}},
async confirm(f,d){if(!validate(f,{userId:R.req,code:R.req}))return;
 try{await call('/api/author/confirm-email',{userId:d.userId,code:d.code});flash={t:'ok',m:t('m_conf')};go('login')}catch(e){show(errMsg(e))}},
async resend(f,d){if(!validate(f,{email:R.email}))return;
 try{await call('/api/author/resend-confirm-email',{email:d.email});pending.email=d.email;show(t('resent'),'ok')}catch(e){show(errMsg(e))}},
async forgot(f,d){if(!validate(f,{email:R.email}))return;
 try{await call('/api/author/resend-change-password',{email:d.email});pending={email:d.email};flash={t:'ok',m:t('m_fg')};go('reset')}catch(e){show(errMsg(e))}},
async reset(f,d){if(!validate(f,{email:R.email,code:R.req,newPassword:R.pw,confirmPw:(v,raw)=>raw===f.querySelector('#newPassword').value?'':'e_match'}))return;
 try{await call('/api/author/reset-password',{email:d.email,code:d.code,newPassword:d.newPassword});pending={email:d.email};flash={t:'ok',m:t('m_rs')};go('login')}catch(e){show(errMsg(e))}}};
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-act]');if(!f)return;e.preventDefault();
 const b=f.querySelector('button');b.disabled=true;const d=Object.fromEntries(new FormData(f));d.email=(d.email||'').trim();
 try{await H[f.dataset.act](f,d)}finally{b.disabled=false}});
document.addEventListener('input',e=>{const i=e.target;const box=i.id&&document.querySelector(`[data-rules="${i.id}"]`);if(box)box.querySelectorAll('span').forEach(s=>s.className=new RegExp(s.dataset.re).test(i.value)?'y':'')});
document.addEventListener('click',async e=>{const c=e.target.closest('[data-eye],[data-google],[data-out],[data-ref],[data-test],[data-tlang],[data-ttheme],[data-ai]');if(!c)return;if(c.dataset.ai!==undefined){ai=+c.dataset.ai;c.parentNode.dataset.i=ai;return}if(c.dataset.tlang!==undefined){lang=lang==='ar'?'en':'ar';ls.set('sfne_lang',lang);chrome();return render()}if(c.dataset.ttheme!==undefined){theme=isDark()?'light':'dark';ls.set('sfne_theme',theme);chrome();return render()}
 if(c.dataset.eye!==undefined){const i=$('#'+c.dataset.eye);const s=i.type==='password';i.type=s?'text':'password';c.innerHTML=s?IC.eo:IC.e}
 else if(c.dataset.google!==undefined){const back=location.origin+location.pathname+'#callback';
  if(MOCK){go('callback')}else location.href=API+'/api/author/login-google?returnUrl='+encodeURIComponent(back)}
 else if(c.dataset.out!==undefined){c.disabled=true;await call('/api/author/revoke-refresh-token',{token:sess&&sess.token||'',refreshToken:sess&&sess.rt||''}).catch(()=>{});await call('/api/author/logout').catch(()=>{});clearSess();flash={t:'ok',m:t('m_out')};go('login')}
 else if(c.dataset.ref!==undefined){c.disabled=true;if(!(await refresh()))expire();else tick();c.disabled=false}
 else if(c.dataset.test!==undefined){try{await call('/api/demo/protected',{},true);show(t('tok'),'ok')}catch(e){show(errMsg(e))}tick()}});

/* ---------- Google callback + session timers ---------- */
async function doCallback(){try{let d;
 if(MOCK){d=(await mock('/api/author/google-demo',{})).data}
 else d=await call('/api/author/refresh-token',{},false,false); // backend set HttpOnly cookies; read them via refresh fallback
 setSess(d);go('dashboard')}catch(e){flash={t:'err',m:errMsg(e.status?e:{data:{code:'ExternalLoginFailed'}})};go('login')}}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){if(!sess)return;const tk=$('#tk');if(tk){tk.textContent=fmt(sess.exp-Date.now());$('#rt').textContent=new Date(sess.rExp).toLocaleString(lang==='ar'?'ar-EG':'en-GB')}}
setInterval(async()=>{if(!sess)return;tick();
 if(sess.rExp<Date.now())return expire();
 if(sess.exp-Date.now()<20000&&!refreshing){if(!(await refresh()))expire()}},1000);
let ai=0;setInterval(()=>{const a=document.querySelector('.acc');if(a&&!a.matches(':hover')){ai=(ai+1)%3;a.dataset.i=ai}},3200);
addEventListener('hashchange',render);

/* ---------- Boot: restore session from cookies ---------- */
(async()=>{chrome();const saved=JSON.parse(ls.get('sfne_sess')||sst.get('sfne_sess')||'null');
 if(saved&&saved.rExp>Date.now()){$('#app').innerHTML=V.callback();if(!(await refresh())){clearSess()}}
 render()})();
</script>
</body>
</html>
