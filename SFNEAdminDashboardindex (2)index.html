<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFNE Admin · Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E0DFCE;--fld:#F5F0E8;--card:#fff;--tx:#2B362E;--mut:#6b7367;--line:#e3dccf;--pri:#6B8063;--spr:#BFC4A3;--acc:#D9875A;--cta:#9A4F27;--ctx:#fff;--err:#B8473A;--errbg:#fbebe8;--okbg:#e9efe5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2620;--fld:#2B362E;--card:#2B362E;--tx:#F5F0E8;--mut:#BFC4A3;--line:#3f4c42;--pri:#BFC4A3;--cta:#D9875A;--ctx:#2B362E;--err:#ff8f80;--errbg:#4a2a26;--okbg:#34443a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2620;--fld:#2B362E;--card:#2B362E;--tx:#F5F0E8;--mut:#BFC4A3;--line:#3f4c42;--pri:#BFC4A3;--cta:#D9875A;--ctx:#2B362E;--err:#ff8f80;--errbg:#4a2a26;--okbg:#34443a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Inter,Cairo,system-ui,sans-serif;min-height:100vh}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] button{font-family:Cairo,Inter,system-ui,sans-serif}
h1,h2,h3,.brand b{font-family:Poppins,Cairo,sans-serif;margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:14px;line-height:1.25}.brand b{font-size:18px;font-weight:700;letter-spacing:-.4px;display:block}.brand b i{font-style:normal;color:color-mix(in srgb,var(--acc) 75%,var(--tx))}.brand small{color:color-mix(in srgb,var(--pri) 70%,var(--tx));font-size:15px;font-weight:700;display:block}
.logo{width:56px;height:56px;border-radius:16px;background:var(--pri);display:grid;place-items:center;box-shadow:0 4px 12px rgba(107,128,99,.35);flex:none}
.nav .btns{display:flex;gap:8px;align-items:center}
.pill{border:1.5px solid var(--tx);background:transparent;color:var(--tx);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}.pill.cta{background:var(--cta);border-color:var(--cta);color:var(--ctx)}.ic svg{width:24px;height:24px}.ic{width:52px;height:52px;border-radius:50%;border:2px solid #B2AB9C;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer;padding:0}
.demo{margin:10px auto 0;width:min(1100px,calc(100% - 24px));font-size:13px;color:var(--mut);text-align:center}
.demo code{background:var(--okbg);padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed}
.grid{width:min(1100px,calc(100% - 24px));margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 150px)}
.hero h1{font-size:clamp(30px,4.4vw,52px);line-height:1.25}.hero h1 span{color:var(--pri)}
.plan{position:relative;margin:26px 0 48px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;max-width:480px}
.plan .row{display:flex;gap:18px;align-items:center}.badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mut);margin-bottom:14px}.ph{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}.live{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:3px 10px;font:600 11px Poppins,sans-serif;letter-spacing:.5px}.live u{width:8px;height:8px;border-radius:50%;background:var(--acc)}.strip{display:flex;gap:12px;align-items:center;margin-top:16px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--pri) 12%,var(--bg))}.strip small,.coach small{color:var(--mut);display:block}.sic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--pri) 22%,var(--card));display:grid;place-items:center;color:var(--pri)}.coach{position:absolute;bottom:-30px;inset-inline-start:26%;background:var(--card);border:1.5px solid var(--acc);border-radius:18px;padding:10px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}.bars p{display:flex;justify-content:space-between;margin:0 0 4px;font-weight:600}.bars p span:last-child{direction:ltr}
.ring{width:112px;height:112px;flex:none}
.bars{flex:1;display:grid;gap:10px;font-size:13px}.bars i{display:block;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bars i u{display:block;height:100%;border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;width:100%;max-width:470px;margin-inline:auto;box-shadow:0 10px 40px rgba(43,54,46,.08)}
.card h2{font-size:26px}.card .sub{color:var(--mut);margin:4px 0 20px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.in{position:relative}
input{width:100%;height:54px;padding:0 16px;border:1.5px solid #B2AB9C;border-radius:16px;background:var(--fld);color:var(--tx);font:inherit;font-size:16px;text-align:start}
[dir=rtl] input{text-align:right}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
input.bad{border-color:var(--err)}
.eye{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:6px}
.fe{color:var(--err);font-size:13px;display:block;min-height:0}
.btn{width:100%;margin-top:20px;height:54px;border:0;border-radius:16px;background:var(--cta);color:var(--ctx);font:700 17px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px rgba(154,79,39,.3)}
.btn.sec{background:transparent;color:var(--tx);border:1.5px solid #B2AB9C;margin-top:12px}
.btn:disabled{opacity:.6;cursor:wait}
.alert{padding:11px 14px;border-radius:14px;font-size:14px;margin-bottom:6px}
.alert.err{background:var(--errbg);color:var(--err)}.alert.ok{background:var(--okbg);color:var(--tx)}
.alert a,.lnk{color:var(--cta);cursor:pointer;font-weight:600;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.foot{text-align:center;color:var(--mut);font-size:14px;margin-top:18px}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}.rules span{padding:2px 9px;border-radius:99px;background:var(--line);color:var(--mut)}.rules .y{background:var(--okbg);color:var(--tx)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}
.dash{width:min(1100px,calc(100% - 24px));margin:20px auto;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.dash .card{max-width:none;margin:0;padding:24px}
.big{font:700 30px Poppins,sans-serif;color:color-mix(in srgb,var(--acc) 75%,var(--tx));direction:ltr;unicode-bidi:embed}
@media(max-width:860px){.grid{grid-template-columns:1fr;min-height:0}.hero{display:none}.brand b{font-size:16px}.brand small{font-size:13px}.logo{width:48px;height:48px}.ic{width:44px;height:44px}.nav{padding:12px 14px}.card{padding:22px}}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;direction:ltr}
html[dir=rtl] .split>*{direction:rtl}html[dir=ltr] .split>*{direction:ltr}
.fp{display:flex;flex-direction:column;gap:20px;padding:22px clamp(20px,5vw,56px) 18px}
.fb{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:470px;margin:0 auto;padding:12px 0}
.fb h2{font-size:clamp(26px,3.4vw,36px);line-height:1.3;margin:6px 0 8px;color:color-mix(in srgb,var(--acc) 62%,var(--tx))}.fb .sub{color:var(--mut);margin:0 0 20px}.fb .demo{text-align:start;margin:0 0 6px;width:auto}
.tag{color:color-mix(in srgb,var(--pri) 75%,var(--tx));font-weight:700;font-size:14px}
.ff{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}.ff svg{width:18px;height:18px}
.lr{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}.lr label{margin:0}.lr a{font-size:13px}
.has input{padding-inline-start:46px}.in.pw input{padding-inline-end:46px}.ii{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:color-mix(in srgb,var(--acc) 85%,var(--tx));display:flex;pointer-events:none}.ii svg,.eye svg{width:20px;height:20px}
.rem{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:14px;font-weight:400;cursor:pointer}.rem input{width:22px;height:22px;padding:0;accent-color:var(--acc)}
.btn svg{width:20px;height:20px}.btn.sec{box-shadow:none}
.logo{background:none;box-shadow:none;overflow:hidden;border-radius:31%}.logo svg{display:block;width:100%;height:100%}
.vp{position:relative;overflow:hidden;background:linear-gradient(160deg,#2f3d33,#18211b);color:#F5F0E8;padding:36px;display:flex;flex-direction:column;justify-content:flex-end}
.route{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;background:#F5F0E8;color:#2B362E;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.vt{position:relative;z-index:1}.vt small{opacity:.85;font-size:15px}.vt h2{font-size:clamp(30px,3.6vw,50px);line-height:1.2;margin:10px 0 14px}.vt p{opacity:.85;margin:0;max-width:440px}
.vl{position:absolute;top:30px;inset-inline-start:36px;display:flex;align-items:center;gap:10px;font:700 20px Poppins,sans-serif}.vl .logo{width:44px;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.chips .chip{position:static;display:inline-flex;align-items:center;gap:8px;background:#BFC4A3;color:#2B362E;padding:8px 16px;border-radius:999px;box-shadow:none}.chips .chip:before{content:"";width:8px;height:8px;border-radius:50%;background:#D9875A}.chips .chip:nth-child(2){background:#D9875A}.chips .chip:nth-child(3){background:#B2AB9C}.chips .chip:nth-child(n+2):before{background:#2B362E}.dash .card:nth-child(1){border-top:4px solid var(--acc)}.dash .card:nth-child(2){border-top:4px solid var(--spr)}.ff svg{color:var(--acc)}
.vp{justify-content:center;padding-top:96px}.vt h2{font-size:clamp(22px,2.4vw,32px)}
.stack{display:grid;gap:16px;margin-bottom:34px}
.sc{position:relative;display:flex;align-items:center;gap:16px;padding:22px 24px 28px;border-radius:28px;box-shadow:0 16px 34px rgba(0,0,0,.3);transition:transform .25s;overflow:hidden}
.sc i{width:52px;height:52px;border-radius:17px;background:#2B362E;display:grid;place-items:center;flex:none}.sc i svg{width:26px;height:26px}
.sc b{flex:1;font:700 clamp(20px,2.2vw,27px)/1.25 Poppins,Cairo,sans-serif}
.sc u{text-decoration:none;font:700 38px Poppins,sans-serif;opacity:.22}
.sc span{position:absolute;inset-inline-start:24px;bottom:11px;height:5px;width:var(--w);max-width:calc(100% - 48px);border-radius:9px;background:currentColor;opacity:.35}
.sc:nth-child(1){transform:rotate(-2deg);margin-inline-end:8%}.sc:nth-child(2){transform:rotate(1.5deg);margin-inline-start:8%}.sc:nth-child(3){transform:rotate(-1deg);margin-inline-end:4%}.sc:hover{transform:rotate(0) translateY(-4px)}
.ca{background:#D9875A;color:#2B362E}.ca i svg{color:#D9875A}
.cb{background:#6B8063;color:#F5F0E8}.cb i{background:#F5F0E8}.cb i svg{color:#6B8063}
.cc{background:#BFC4A3;color:#2B362E}.cc i svg{color:#BFC4A3}
.vp{justify-content:flex-start}.vt{flex:1;display:flex;flex-direction:column}
.acc{flex:1;min-height:340px;display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.ab{flex:1;display:flex;align-items:center;gap:16px;padding:0 24px;border-radius:26px;cursor:pointer;overflow:hidden;transition:flex .55s cubic-bezier(.3,.8,.3,1),box-shadow .3s}
.ab i{width:52px;height:52px;border-radius:17px;background:#2B362E;display:grid;place-items:center;flex:none}.ab i svg{width:26px;height:26px}
.ab>div{flex:1;min-width:0}.ab b{display:block;font:700 clamp(20px,2.2vw,28px)/1.3 Poppins,Cairo,sans-serif}
.ab .ad{margin:4px 0 0;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .4s;font-size:14px;line-height:1.5}
.ab u{text-decoration:none;font:700 44px Poppins,sans-serif;opacity:.2}
.acc[data-i="0"] .ab:nth-child(1),.acc[data-i="1"] .ab:nth-child(2),.acc[data-i="2"] .ab:nth-child(3){flex:2.6;box-shadow:0 16px 34px rgba(0,0,0,.35)}
.acc[data-i="0"] .ab:nth-child(1) .ad,.acc[data-i="1"] .ab:nth-child(2) .ad,.acc[data-i="2"] .ab:nth-child(3) .ad{max-height:70px;opacity:.9}
.lines{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(26px,5vh,48px);position:relative;z-index:1}
.ln{display:flex;align-items:center;gap:22px}
.ln s{display:block;flex:none;width:72px;height:8px;border-radius:9px;animation:gl .9s cubic-bezier(.3,.8,.3,1) both;transition:width .35s}
.ln:nth-child(2) s{animation-delay:.15s}.ln:nth-child(3) s{animation-delay:.3s}.ln:hover s{width:120px}
.ln b{font:700 clamp(28px,3.4vw,46px)/1.2 Poppins,Cairo,sans-serif;color:#F5F0E8}
@keyframes gl{from{width:0}}
@media(max-width:900px){.split{grid-template-columns:1fr}.vp{display:none}}
input[type=password]::-ms-reveal,input[type=password]::-ms-clear{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb h2{color:#fff}}

  let d=null;try{d=await r.json()}catch(e){}return{status:r.status,data:d}}catch(e){clearTimeout(to);return{status:0,data:null}}}
async function call(path,body,auth,retry=true,method){
 let r=await raw(path,body,auth,method);
 if(r.status===401&&auth&&retry&&path!=='/api/author/refresh-token'){if(await refresh())return call(path,body,auth,false,method);expire();throw{status:401,data:{code:'User.InvalidRefreshToken'}}}
 if(r.status<200||r.status>=300)throw r;return r.data}
function refresh(){ // shared promise: concurrent 401s wait for one refresh
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{const d=await call('/api/author/refresh-token',{token:sess&&sess.token||'',refreshToken:sess&&sess.rt||''},false,false);setSess(d);return true}catch(e){return false}finally{refreshing=null}})();return refreshing}
function setSess(d){sess={user:{id:d.id,email:d.email,name:d.firstName+' '+d.lastName,userName:d.userName},token:d.token,rt:d.refreshToken,exp:Date.now()+d.expiresIn*1000,rExp:new Date(d.refreshTokenExpiration).getTime()};saveSess()}
// بنحفظ التوكنات لأن الكوكيز مش هتتبعت من github.io لدومين الباك إند (cross-site)
function saveSess(){(ls.get('sfne_rem')==='1'?ls:sst).set('sfne_sess',JSON.stringify({user:sess.user,rExp:sess.rExp,token:sess.token,rt:sess.rt}))}
function clearSess(){sess=null;ls.del('sfne_sess');sst.del('sfne_sess')}
function expire(){clearSess();flash={t:'err',m:t('m_exp')};go('login')}
function errMsg(e){if(!e||e.status===0)return t('net');const j=JSON.stringify(e.data||'');
 const k=Object.keys(S).find(k=>/^(User\.|ExternalLoginFailed|MissingEmail)/.test(k)&&j.includes(k));if(k)return t(k);
 const v=e.data&&e.data.errors;if(v){const x=(Array.isArray(v)?v:Object.values(v).flat())[0];if(x)return esc(typeof x==='string'?x:x.description||x.message||t('gen'))}
 if(e.data&&(e.data.detail||e.data.message))return esc(e.data.detail||e.data.message);return t('gen')}

IC.dm=SVG('<path d="M7 17 17 7M4.5 14.5l5 5M14.5 4.5l5 5M3 16l2 2M16 3l2 2M19 6l2 2M6 19l2 2"/>');IC.lf=SVG('<path d="M5 19C5 10 11 5 20 4c0 9-5 15-15 15z"/><path d="M9 15l5-5"/>');IC.ch=SVG('<path d="M4 20h16M7 20v-6M12 20V6M17 20v-9"/>');
const LOGO='<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="20" fill="#6B8063"/><g transform="rotate(45 32 32)" fill="#BFC4A3"><rect x="22" y="29.5" width="20" height="5"/><rect x="17" y="20" width="5" height="24"/><rect x="14" y="23" width="3" height="18"/><rect x="11" y="26" width="3" height="12"/><rect x="42" y="20" width="5" height="24"/><rect x="47" y="23" width="3" height="18"/><rect x="50" y="26" width="3" height="12"/></g></svg>';

const shell=inner=>`<div class="split"><section class="fp">${nav()}<div class="fb"><span class="tag">${t(TAGS[cur]||'tag_in')}</span>${inner}</div><div class="ff">${IC.sh}<span>${t('prot_by')}</span></div></section><aside class="vp" aria-hidden="true"><div class="vl"><div class="logo">${LOGO}</div><span>SFNE</span></div>${RIGHT==='lines'?`<div class="lines"><div class="ln"><s style="background:#D9875A"></s><b>${t('c1')}</b></div><div class="ln"><s style="background:#BFC4A3"></s><b>${t('c2')}</b></div><div class="ln"><s style="background:#B2AB9C"></s><b>${t('c3')}</b></div></div>`:`<div class="vt"><div class="acc" data-i="${ai}"><div class="ab ca" data-ai="0"><i>${IC.dm}</i><div><b>${t('c1')}</b><p class="ad">${t('d1')}</p></div><u>01</u></div><div class="ab cb" data-ai="1"><i>${IC.lf}</i><div><b>${t('c2')}</b><p class="ad">${t('d2')}</p></div><u>02</u></div><div class="ab cc" data-ai="2"><i>${IC.ch}</i><div><b>${t('c3')}</b><p class="ad">${t('d3')}</p></div><u>03</u></div></div><small>${t('v_k')}</small><h2>${t('v_h')}</h2><p>${t('v_p')}</p></div>`}</aside></div>`;

const V={
login:()=>shell(`<h2>${t('login_t')}</h2><p class="sub">${t('login_s')}</p>${alertBox()}<form data-act="login" novalidate>${fld('email','email','email',pending.email||'','autocomplete="username"')}${fld('password','pw','password','','autocomplete="current-password"','')}<label class="rem"><input type="checkbox" name="remember">${t('rem')}</label><button class="btn">${t('signin')}${IC.ar}</button></form>`),
dashboard:()=>`<div style="padding:22px clamp(16px,4vw,48px) 0">${nav()}</div><div class="dash"><div class="card"><div id="prof"><p class="sub">${t('loading')}</p></div><button class="btn sec" data-out>${t('logout')}</button></div><div class="card"><h3>${t('edit_t')}</h3><div id="al" role="alert"></div><form data-act="profile" id="pf" novalidate><p class="sub">${t('loading')}</p></form></div><div class="card"><h3>${t('pw_t')}</h3><div id="al2" role="alert"></div><form data-act="pass" novalidate>${fld('currentPassword','cur','password','','autocomplete="current-password"')}${fld('newPassword','npw','password','','autocomplete="new-password"')}${rules('newPassword')}${fld('confirmPw','cpw','password','','autocomplete="new-password"')}<button class="btn">${t('save')}</button></form></div></div>`
};

/* ---------- Account (info / info-Update / change-password) ---------- */
const IMGRE=/image|photo|picture|avatar/i;
const unwrap=x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.data&&typeof x.data==='object'?x.data:(x&&x.value&&typeof x.value==='object'?x.value:x);
const imgSrc=v=>!v?'':/^(https?:|data:|blob:)/.test(v)?v:API+(v.startsWith('/')?'':'/')+v;
let accP=null;
async function acc(paths,body,method){ // بيجرب البادئات/الأسماء المحتملة لحد ما يلاقي المسار الصح (404 فاضي = مسار مش موجود)
 const ps=[].concat(paths),pre=accP!==null?[accP]:CONFIG.ACC;let last;
 for(const a of pre)for(const p of ps){try{const r=await call(a+p,body,true,true,method);accP=a;return r}catch(e){last=e;if(!(e&&e.status===404&&!e.data))throw e}}
 throw last}
let acct=null;
const isEditable=(k,v)=>!/^id$|Id$/.test(k)&&!/^email$/i.test(k)&&!IMGRE.test(k)&&(v===null||['string','number'].includes(typeof v));
const imgKey=a=>Object.keys(a).find(k=>IMGRE.test(k));
const imgField=a=>{const k=imgKey(a);return k?k.replace(/(Url|Path|Link)$/i,''):'image'}; // اسم حقل الصورة في الـ multipart
const EK=['firstName','lastName','email','phoneNumber'];
const gv=k=>{const kk=acct&&Object.keys(acct).find(x=>x.toLowerCase()===k.toLowerCase());return kk&&acct[kk]!=null?acct[kk]:''};
async function loadAccount(){
 const box=$('#prof'),pf=$('#pf');if(!box)return;
 try{acct=unwrap(await acc('/info',null,'GET'))||{}}catch(e){box.innerHTML=`<div class="alert err">${errMsg(e)}</div>`;if(pf)pf.innerHTML='';return}
 const ik=imgKey(acct),pic=ik?imgSrc(acct[ik]):'';
 const nm=[acct.firstName,acct.lastName].filter(Boolean).join(' ')||acct.fullName||acct.userName||sess.user.name;
 const av=pic?`<img src="${esc(pic)}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--line)">`:`<div class="logo" style="width:96px;height:96px;border-radius:50%;font:700 32px Poppins,sans-serif;color:#fff">${esc((nm[0]||'?').toUpperCase())}</div>`;
 const rows=Object.entries(acct).filter(([k,v])=>!/^id$|Id$/.test(k)&&!IMGRE.test(k)&&v!==null&&v!==''&&typeof v!=='object').map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">${esc(lbl(k))}</span><b style="direction:ltr;unicode-bidi:embed;text-align:end">${esc(typeof v==='boolean'?(v?'✓':'✗'):v)}</b></div>`).join('');
 box.innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">${av}<div><h2 style="font-size:22px">${esc(nm)}</h2><p class="sub" style="margin:2px 0 0">${t('acc_s')}</p></div></div>${rows}<div style="height:16px"></div>`;
 const fields=EK.map(k=>{const ty=k==='gender'?'number':k==='email'?'email':k==='phoneNumber'?'tel':'text';return `<label for="f_${k}">${esc(k==='gender'?t('gh'):lbl(k))}</label><div class="in"><input id="f_${k}" name="${k}" type="${ty}" value="${esc(gv(k))}" ${ty==='tel'||ty==='email'?'dir="ltr"':''}></div>`}).join('');
 pf.innerHTML=`${fields}<label for="f_img">${t('photo')}</label><div class="in"><input id="f_img" name="ProfileImageUrl" type="file" accept="image/*" style="padding:14px 16px;height:auto"></div><button class="btn">${t('save')}</button>`}
function msg(id,m,type){const a=$(id);if(a)a.innerHTML=`<div class="alert ${type||'err'}">${m}</div>`}
/* ---------- Router ---------- */
const PUB=['login'];
function go(n){if(location.hash==='#'+n)render();else location.hash='#'+n}
function render(){let n=location.hash.slice(1);if(!V[n])n=sess?'dashboard':'login';
 if(n==='dashboard'&&!sess){flash=flash||{t:'ok',m:t('m_need')};n='login';history.replaceState(null,'','#login')}
 if(sess&&PUB.includes(n)){n='dashboard';history.replaceState(null,'','#dashboard')}
 cur=n;$('#app').innerHTML=V[n]();document.documentElement.scrollTop=0;if(n==='dashboard')loadAccount()}
function chrome(){const h=document.documentElement;h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';
 if(theme)h.dataset.theme=theme;else delete h.dataset.theme;
 
 }
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;


/* ---------- Forms ---------- */
const show=(m,type='err')=>{const a=$('#al');if(a)a.innerHTML=`<div class="alert ${type}">${m}</div>`};
function validate(f,rule){let bad=false;f.querySelectorAll('.fe').forEach(x=>x.textContent='');f.querySelectorAll('input').forEach(i=>i.classList.remove('bad'));
 for(const [id,fn] of Object.entries(rule)){const i=f.querySelector('#'+id);const m=fn(i.value.trim(),i.value);if(m){bad=true;f.querySelector('#e_'+id).textContent=t(m);i.classList.add('bad')}}return !bad}
const R={req:v=>v?'':'req',email:v=>!v?'req':EM.test(v)?'':'e_email',len:v=>!v?'req':v.length<3||v.length>100?'e_len':'',pw:(v,raw)=>!raw?'req':PW.test(raw)?'':'e_pw',pwlogin:(v,raw)=>raw?'':'req'};
const H={
async login(f,d){if(!validate(f,{email:R.email,password:R.pwlogin}))return;pending={email:d.email};
 ls.set('sfne_rem',d.remember?'1':'0');show(t('loading'),'ok');try{setSess(await call('/api/author/login',{email:d.email,password:d.password}));go('dashboard')}catch(e){show(errMsg(e))}},
async profile(f){const fd=new FormData(f);for(const [k,v] of [...fd.entries()]){if(v instanceof File){if(!v.size)fd.delete(k)}else if(String(v).trim()===String(gv(k)).trim())fd.delete(k)}
 if(![...fd.keys()].length)return msg('#al',t('nochg'),'ok');
 try{await acc(['/info-update','/info-Update'],fd,'PUT');msg('#al',t('m_saved'),'ok');
  await loadAccount();if(acct){const n=[acct.firstName,acct.lastName].filter(Boolean).join(' ');if(n){sess.user.name=n;saveSess()}}}catch(e){msg('#al',errMsg(e))}},
async pass(f,d){if(!validate(f,{currentPassword:R.pwlogin,newPassword:R.pw,confirmPw:(v,raw)=>raw===f.querySelector('#newPassword').value?'':'e_match'}))return;
 try{await acc(['/change-password'],{currentPassword:d.currentPassword,newPassword:d.newPassword},'PUT');f.reset();f.querySelectorAll('.rules span').forEach(x=>x.className='');msg('#al2',t('m_pw'),'ok')}catch(e){msg('#al2',errMsg(e))}}};
async function runForm(f){const b=f.querySelector('button:not([type=button])');if(!b||b.disabled)return;b.disabled=true;const d=Object.fromEntries(new FormData(f));d.email=(d.email||'').trim();
 try{await H[f.dataset.act](f,d)}finally{b.disabled=false}}
// بنعتمد على الضغط المباشر على الزرار (بيشتغل حتى داخل المعاينات المقيّدة اللي بتمنع إرسال الفورم)
document.addEventListener('click',e=>{const b=e.target.closest('form[data-act] button:not([type=button])');if(!b)return;e.preventDefault();runForm(b.closest('form'))},true);
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-act]');if(!f)return;e.preventDefault();runForm(f)});
document.addEventListener('input',e=>{const i=e.target;const box=i.id&&document.querySelector(`[data-rules="${i.id}"]`);if(box)box.querySelectorAll('span').forEach(s=>s.className=new RegExp(s.dataset.re).test(i.value)?'y':'')});
document.addEventListener('click',async e=>{const c=e.target.closest('[data-eye],[data-out],[data-tlang],[data-ttheme],[data-ai]');if(!c)return;if(c.dataset.ai!==undefined){ai=+c.dataset.ai;c.parentNode.dataset.i=ai;return}if(c.dataset.tlang!==undefined){lang=lang==='ar'?'en':'ar';ls.set('sfne_lang',lang);chrome();return render()}if(c.dataset.ttheme!==undefined){theme=isDark()?'light':'dark';ls.set('sfne_theme',theme);chrome();return render()}
 if(c.dataset.eye!==undefined){const i=$('#'+c.dataset.eye);const s=i.type==='password';i.type=s?'text':'password';c.innerHTML=s?IC.eo:IC.e}
 else if(c.dataset.out!==undefined){c.disabled=true;await call('/api/author/revoke-refresh-token',{token:sess&&sess.token||'',refreshToken:sess&&sess.rt||''}).catch(()=>{});await call('/api/author/logout').catch(()=>{});clearSess();flash={t:'ok',m:t('m_out')};go('login')}});
 

/* ---------- session timers ---------- */
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){if(!sess)return;const tk=$('#tk');if(tk){tk.textContent=fmt(sess.exp-Date.now());$('#rt').textContent=new Date(sess.rExp).toLocaleString(lang==='ar'?'ar-EG':'en-GB')}}
setInterval(async()=>{if(!sess)return;tick();
 if(sess.rExp<Date.now())return expire();
 if(sess.exp-Date.now()<20000&&!refreshing){if(!(await refresh()))expire()}},1000);
let ai=0;setInterval(()=>{const a=document.querySelector('.acc');if(a&&!a.matches(':hover')){ai=(ai+1)%3;a.dataset.i=ai}},3200);
addEventListener('hashchange',render);

/* ---------- Boot: restore session from cookies ---------- */
(async()=>{chrome();const saved=JSON.parse(ls.get('sfne_sess')||sst.get('sfne_sess')||'null');
 if(saved&&saved.rExp>Date.now()&&saved.rt){sess={user:saved.user,token:saved.token,rt:saved.rt,exp:0,rExp:saved.rExp};if(!(await refresh()))clearSess()}else if(saved)clearSess()
 render()})();
</script>
