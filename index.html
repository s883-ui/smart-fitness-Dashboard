<!DOCTYPE html>
<!--
  index.html — الهيكل الأساسي للـ dashboard، وهو الملف اللي بتفتحه في المتصفح.
  lang="ar" dir="rtl": الصفحة تبدأ عربي ومن اليمين للشمال (الـ JavaScript بيغيّرهم لما تدوس EN).
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- السطر ده مهم للموبايل: بيخلي الصفحة تاخد عرض الشاشة الحقيقي -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Fitness & Nutrition</title>

  <!-- الخط (Readex Pro) بيدعم العربي والإنجليزي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- الأيقونات: Material Symbols من Google -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">

  <!-- الربط بملف الشكل -->
  <link rel="stylesheet" href="css/style.css">

  <!-- مكتبة الـ charts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <!-- الطبقة الغامقة اللي بتظهر ورا الـ sidebar على الموبايل، ولما تدوس عليها القايمة تتقفل -->
  <div class="overlay" onclick="toggleNav(false)"></div>

  <!-- هيكل الصفحة: 3 أماكن فاضية، والـ JavaScript هو اللي بيملاها -->
  <div class="app">
    <aside class="side" id="side"></aside>        <!-- القايمة الجانبية: renderSide() -->
    <div class="main">
      <header class="top" id="top"></header>       <!-- الشريط اللي فوق: renderTop() -->
      <main class="content" id="content"></main>   <!-- الصفحة الحالية: render() -->
    </div>
  </div>

  <!-- مكان نافذة الوصفة (Modal) -->
  <div id="modal-root"></div>

  <!--
    الربط بملفات الـ JavaScript. الترتيب هنا مهم جداً:
    كل ملف بيستخدم حاجات من الملف اللي قبله، فلازم يتحمّلوا بالترتيب ده.
    1) data.js        البيانات والـ State
    2) components.js  القطع اللي بتتكرر (بتستخدم data.js)
    3) pages.js       الصفحات (بتستخدم الاتنين)
    4) app.js         بيشغّل كل حاجة (لازم يبقى الأخير)
  -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
